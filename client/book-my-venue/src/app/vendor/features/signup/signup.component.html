<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Vendor Registration</h1>
      <p class="mt-2 text-sm text-gray-600">List your venues on BookMyVenue</p>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <app-input label="First Name" formControlName="firstName" [required]="true"
              [error]="form.controls.firstName.touched && form.controls.firstName.errors ? 'Required' : ''" />
            <app-input label="Last Name" formControlName="lastName" [required]="true"
              [error]="form.controls.lastName.touched && form.controls.lastName.errors ? 'Required' : ''" />
          </div>
          <app-input label="Email" type="email" formControlName="email" [required]="true"
            [error]="form.controls.email.touched && form.controls.email.errors ? 'Valid email required' : ''" />
          <app-input label="Phone" type="tel" formControlName="phone" [required]="true"
            [error]="form.controls.phone.touched && form.controls.phone.errors ? 'Valid 10-digit phone required' : ''" />
          <app-input label="Password" type="password" formControlName="password" [required]="true"
            [error]="form.controls.password.touched && form.controls.password.errors ? 'Min 6 characters' : ''" />
          <app-input label="Confirm Password" type="password" formControlName="confirmPassword" [required]="true"
            [error]="form.controls.confirmPassword.touched && form.controls.confirmPassword.errors ? 'Passwords must match' : ''" />
        </div>
        <div class="mt-6">
          <app-button label="Create Vendor Account" type="submit" [loading]="loading()" [fullWidth]="true" />
        </div>
      </form>
      <p class="mt-6 text-center text-sm text-gray-600">
        Already have an account? <a routerLink="/vendor/login" class="text-indigo-600 font-medium">Sign in</a>
      </p>
    </div>
  </div>
</div>
