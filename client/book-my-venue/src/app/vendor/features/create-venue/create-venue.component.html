<div class="max-w-3xl mx-auto">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Create New Venue</h1>

  <div class="bg-white rounded-xl border border-gray-200 p-6">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="space-y-4">
        <app-input label="Venue Name" formControlName="name" [required]="true" placeholder="e.g. Grand Ballroom"
          [error]="form.controls.name.touched && form.controls.name.errors ? 'Venue name is required' : ''" />

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Description <span class="text-red-500">*</span></label>
          <textarea formControlName="description" rows="4" placeholder="Describe your venue..."
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <app-input label="Address" formControlName="address" [required]="true" />

        <div class="grid grid-cols-3 gap-4">
          <app-input label="City" formControlName="city" [required]="true" />
          <app-input label="State" formControlName="state" [required]="true" />
          <app-input label="ZIP Code" formControlName="zipCode" [required]="true" />
        </div>

        <div class="grid grid-cols-3 gap-4">
          <app-input label="Capacity" type="number" formControlName="capacity" [required]="true" />
          <app-input label="Price/Hour" type="number" formControlName="pricePerHour" [required]="true" />
          <app-input label="Price/Day" type="number" formControlName="pricePerDay" [required]="true" />
        </div>

        <app-input label="Amenities" formControlName="amenities" placeholder="WiFi, Parking, AC (comma separated)" hint="Separate amenities with commas" />
      </div>

      <div class="mt-6 flex gap-3">
        <app-button label="Create Venue" type="submit" [loading]="saving()" />
        <app-button label="Cancel" variant="outline" (clicked)="router.navigate(['/vendor/venues'])" />
      </div>
    </form>
  </div>
</div>
