<div class="min-h-screen flex items-center justify-center bg-gray-900 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white">Admin Login</h1>
      <p class="mt-2 text-sm text-gray-400">Access the admin control panel</p>
    </div>
    <div class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 p-8">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="space-y-4">
          <app-input label="Email Address" type="email" formControlName="email" [required]="true"
            [error]="form.controls.email.touched && form.controls.email.errors ? 'Valid email required' : ''" />
          <app-input label="Password" type="password" formControlName="password" [required]="true"
            [error]="form.controls.password.touched && form.controls.password.errors ? 'Min 6 characters' : ''" />
        </div>
        <div class="flex justify-end mt-4 mb-6">
          <a routerLink="/admin/forgot-password" class="text-sm text-red-400 hover:text-red-300">Forgot password?</a>
        </div>
        <app-button label="Sign In" type="submit" [loading]="loading()" [fullWidth]="true" />
      </form>
    </div>
  </div>
</div>
