<div>
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Users Management</h1>
  @if (loading()) { <app-loader /> } @else if (users().length === 0) {
    <app-empty-state title="No users" message="Users will appear here once they register." icon="users" />
  } @else {
    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
      <table class="w-full text-sm text-left">
        <thead class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider">
          <tr><th class="px-4 py-3">Name</th><th class="px-4 py-3">Email</th><th class="px-4 py-3">Phone</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Actions</th></tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          @for (user of users(); track user.id) {
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-3 font-medium">{{ user.firstName }} {{ user.lastName }}</td>
              <td class="px-4 py-3 text-gray-600">{{ user.email }}</td>
              <td class="px-4 py-3 text-gray-600">{{ user.phone }}</td>
              <td class="px-4 py-3"><span [class]="'px-2 py-1 text-xs rounded-full ' + (user.isActive ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700')">{{ user.isActive ? 'Active' : 'Inactive' }}</span></td>
              <td class="px-4 py-3"><button class="text-sm text-indigo-600 hover:text-indigo-500">View</button></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <app-pagination [currentPage]="currentPage()" [totalPages]="totalPages()" (pageChanged)="onPageChange($event)" />
  }
</div>
