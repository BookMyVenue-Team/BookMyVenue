<div class="flex h-screen bg-gray-50">
  <!-- Sidebar -->
  <aside
    class="bg-white border-r border-gray-200 transition-all duration-300 flex flex-col"
    [class.w-64]="sidebarOpen()"
    [class.w-16]="!sidebarOpen()"
  >
    <div class="flex items-center justify-between p-4 border-b border-gray-200">
      @if (sidebarOpen()) {
        <h1 class="text-lg font-bold text-indigo-600">BookMyVenue</h1>
      }
      <button
        class="p-1.5 rounded-lg hover:bg-gray-100 transition-colors"
        (click)="toggleSidebar()"
      >
        <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>

    <nav class="flex-1 py-4">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-indigo-50 text-indigo-600 border-r-2 border-indigo-600"
          class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors"
        >
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            @switch (item.icon) {
              @case ('search') {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              }
              @case ('calendar') {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              }
              @case ('user') {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              }
            }
          </svg>
          @if (sidebarOpen()) {
            <span>{{ item.label }}</span>
          }
        </a>
      }
    </nav>

    <div class="border-t border-gray-200 p-4">
      <button
        class="flex items-center gap-3 w-full text-sm text-gray-700 hover:text-red-600 transition-colors"
        (click)="logout()"
      >
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        @if (sidebarOpen()) {
          <span>Logout</span>
        }
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
      <div>
        <h2 class="text-lg font-semibold text-gray-900">Welcome back</h2>
        <p class="text-sm text-gray-500">{{ currentUser()?.name }}</p>
      </div>
      <div class="flex items-center gap-4">
        <button class="p-2 rounded-lg hover:bg-gray-100 transition-colors relative">
          <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
        </button>
        <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center">
          <span class="text-sm font-medium text-indigo-600">
            {{ currentUser()?.name?.charAt(0) || 'U' }}
          </span>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet />
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 px-6 py-3 text-center">
      <p class="text-xs text-gray-400">&copy; 2026 BookMyVenue. All rights reserved.</p>
    </footer>
  </div>
</div>
