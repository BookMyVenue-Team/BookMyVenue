<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Welcome Back</h1>
      <p class="mt-2 text-sm text-gray-600">Sign in to your account to continue</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="space-y-4">
          <app-input
            label="Email Address"
            type="email"
            placeholder="you@example.com"
            formControlName="email"
            [required]="true"
            [error]="form.controls.email.touched && form.controls.email.errors ? 'Valid email is required' : ''"
          />

          <app-input
            label="Password"
            type="password"
            placeholder="Enter your password"
            formControlName="password"
            [required]="true"
            [error]="form.controls.password.touched && form.controls.password.errors ? 'Password must be at least 6 characters' : ''"
          />
        </div>

        <div class="flex items-center justify-end mt-4 mb-6">
          <a routerLink="/forgot-password" class="text-sm text-indigo-600 hover:text-indigo-500">
            Forgot your password?
          </a>
        </div>

        <app-button
          label="Sign In"
          type="submit"
          [loading]="loading()"
          [fullWidth]="true"
        />
      </form>

      <p class="mt-6 text-center text-sm text-gray-600">
        Don't have an account?
        <a routerLink="/signup" class="text-indigo-600 font-medium hover:text-indigo-500">Sign up</a>
      </p>
    </div>
  </div>
</div>
