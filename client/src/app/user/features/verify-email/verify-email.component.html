<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Verify your email</h1>
      <p class="mt-2 text-sm text-gray-600">
        Enter the 6-digit code we sent to
        <span class="font-medium text-gray-900">{{ email() || 'your email address' }}</span>
      </p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="space-y-4">
          <app-input
            label="Verification Code"
            placeholder="123456"
            formControlName="otp"
            [required]="true"
            [error]="form.controls.otp.touched && form.controls.otp.errors ? 'Enter the 6-digit code' : ''"
          />
        </div>

        <div class="mt-6">
          <app-button
            label="Verify Email"
            type="submit"
            [loading]="loading()"
            [fullWidth]="true"
          />
        </div>
      </form>

      <p class="mt-6 text-center text-sm text-gray-600">
        Didn't get the code?
        <button
          type="button"
          (click)="resend()"
          [disabled]="resendCooldown() > 0"
          class="text-indigo-600 font-medium hover:text-indigo-500 disabled:text-gray-400 disabled:cursor-not-allowed"
        >
          {{ resendCooldown() > 0 ? 'Resend in ' + resendCooldown() + 's' : 'Resend code' }}
        </button>
      </p>

      <p class="mt-2 text-center text-sm text-gray-600">
        <a routerLink="/login" class="text-indigo-600 font-medium hover:text-indigo-500">Back to sign in</a>
      </p>
    </div>
  </div>
</div>
