<div>
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Venues Management</h1>
  @if (loading()) { <app-loader /> } @else if (venues().length === 0) {
    <app-empty-state title="No venues" message="Venues will appear here once vendors add them." />
  } @else {
    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
      <table class="w-full text-sm text-left">
        <thead class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider">
          <tr><th class="px-4 py-3">Name</th><th class="px-4 py-3">City</th><th class="px-4 py-3">Capacity</th><th class="px-4 py-3">Price/Hr</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Actions</th></tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          @for (venue of venues(); track venue.id) {
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-3 font-medium">{{ venue.name }}</td>
              <td class="px-4 py-3 text-gray-600">{{ venue.city }}</td>
              <td class="px-4 py-3">{{ venue.capacity }}</td>
              <td class="px-4 py-3">{{ venue.pricePerHour }}</td>
              <td class="px-4 py-3"><span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-700">{{ venue.status }}</span></td>
              <td class="px-4 py-3"><button class="text-sm text-indigo-600">View</button></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
